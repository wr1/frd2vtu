[project]
name = "frd2vtu"
version = "0.2.0"
description = "converter from calculix binary frd to vtu"
authors = [{ name = "wr1", email = "8971152+wr1@users.noreply.github.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "pyvista>=0.44.2",
    "pandas>=2.2.0",
    "numpy>=2.2.6",
    "treeparse>=0.3.0",
]

[project.scripts]
frd2vtu = "frd2vtu.cli:main"
frd2vtu_plot = "frd2vtu.plotting:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=."

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# treeparse 0.3.x rejects PEP 585/604 annotations in callback signatures.
"frd2vtu/cli.py" = ["UP006", "UP035", "UP045"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff==0.16.9",
    "pre-commit>=4.0.0",
]
